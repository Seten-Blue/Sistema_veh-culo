<table class="table table-striped">
  <thead>
    <tr>
      <th>ID Mecánico</th>
      <th>ID Vehículo</th>
      <th>Descripción</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let asignacion of asignaciones">
      <td>{{asignacion.id_mecanico}}</td>
      <td>{{asignacion.id_vehiculo}}</td>
      <td>{{asignacion.descripcion}}</td>
      <td>{{asignacion.estado}}</td>
    </tr>
  </tbody>
</table>
