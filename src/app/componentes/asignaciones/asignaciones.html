<div class="container mt-4">
  <h2 class="text-center mb-3">Asignaciones de Vehículos</h2>

  <table class="table table-hover">
    <thead class="table-dark">
      <tr>
        <th>Vehículo</th>
        <th>Mecánico</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of asignaciones">
        <td>{{ a.vehiculo }}</td>
        <td>{{ a.mecanico }}</td>
        <td>{{ a.fecha | date }}</td>
      </tr>
    </tbody>
  </table>
</div>
